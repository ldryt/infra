on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    env:
      RENOVATE: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'renovate/') }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RENOVATE == 'true' && github.head_ref || '' }}
          token: ${{ env.RENOVATE == 'true' && secrets.GH_TOKEN_INFRA_NIX_FLAKE_UPDATE || github.token }}
      - uses: jlumbroso/free-disk-space@v2.0.0
        if: runner.os == 'Linux'
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            extra-substituters = https://nix-cache.ldryt.dev?priority=100
            extra-trusted-public-keys = nix-cache.ldryt.dev:z/MoLMpYfoLlXZMnlLUif6nF3hMVj7+6zGiZE4LxLZ0=
      - name: Build and repair Renovate hashes
        run: bash .github/scripts/check.sh
      - name: Cache
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          NIX_CACHE_SSH_PRIVKEY: ${{ secrets.NIX_CACHE_SSH_PRIVKEY }}
        run: bash .github/scripts/cache.sh
