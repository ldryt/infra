name: Renovate Nix hashes

on:
  pull_request:

permissions:
  contents: write

jobs:
  discover:
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: DeterminateSystems/determinate-nix-action@v3
      - id: matrix
        run: echo "matrix=$(nix eval --json .#ghaMatrix)" >> "$GITHUB_OUTPUT"

  fix-hashes:
    needs: discover
    strategy:
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    runs-on: >-
      ${{
        matrix.platform == 'aarch64-linux' && 'ubuntu-24.04-arm' ||
        matrix.platform == 'aarch64-darwin' && 'macos-15' ||
        matrix.platform == 'x86_64-darwin' && 'macos-15' ||
        'ubuntu-24.04'
      }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build and fix hashes
        env:
          BRANCH: ${{ github.head_ref }}
          TARGET: ${{ matrix.target }}
        run: |
          nix build -L "$TARGET" && exit 0

          determinate-nixd fix hashes --auto-apply

          git diff --quiet && exit 0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update Nix hashes"
          git push origin "HEAD:$BRANCH"
