- name: Provision Clank
  hosts: automation
  gather_facts: false
  force_handlers: true
  become: true
  module_defaults:
    ansible.builtin.copy:
      owner: root
      group: root
      mode: '0644'
    ansible.builtin.template:
      owner: root
      group: root
      mode: '0644'
    ansible.builtin.file:
      owner: root
      group: root
    ansible.builtin.lineinfile:
      mode: '0644'
    community.general.ini_file:
      mode: '0644'
  tasks:
    - name: Configure host
      block:
        - name: Make root writable
          ansible.builtin.command: /usr/bin/rw
          changed_when: false
          tags: always

        - name: Configure automation host
          ansible.builtin.import_role:
            name: clank_host

        - name: Configure PiKVM
          ansible.builtin.import_role:
            name: pikvm

        - name: Configure backups
          ansible.builtin.import_role:
            name: restic
      always:
        - name: Close write window
          tags: always
          block:
            - name: Stop keyring sync
              ansible.builtin.systemd_service:
                name: archlinux-keyring-wkd-sync.service
                state: stopped
          always:
            - name: Restore read-only root
              ansible.builtin.command: /usr/bin/ro
              changed_when: false

    - name: Apply service changes
      ansible.builtin.meta: flush_handlers
      tags: always

    - name: Enable lingering
      ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/clank-linger.conf
      args:
        creates: /var/lib/systemd/linger/automation

    - name: Start host services
      ansible.builtin.systemd_service:
        name: "{{ item }}.service"
        state: started
      loop:
        - user@{{ automation_uid }}
        - clank-multipan
        - bluetooth

  handlers:
    - name: Reboot host
      ansible.builtin.reboot:
        reboot_timeout: 180
