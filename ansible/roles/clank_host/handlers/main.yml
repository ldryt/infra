- name: Reload host units
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: Restart host services

- name: Reconfigure Wi-Fi network
  ansible.builtin.command: networkctl reload
  changed_when: true
  listen: Restart host services

- name: Restart host services
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    state: restarted
  loop:
    - clank-network
    - hostapd
    - avahi-daemon
    - bluetooth
    - clank-multipan
