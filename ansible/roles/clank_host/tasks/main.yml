- name: Mount storage
  ansible.posix.mount:
    path: /srv/automation
    src: "UUID={{ automation_storage_uuid }}"
    fstype: ext4
    opts: defaults,nofail
    state: mounted

- name: Check storage UUID
  ansible.builtin.command: findmnt -n -o UUID --mountpoint /srv/automation
  register: clank_host_storage
  changed_when: false
  failed_when: clank_host_storage.stdout != automation_storage_uuid
  check_mode: false

- name: Protect mount point
  ansible.builtin.file:
    path: /srv/automation
    state: directory
    mode: '0755'

- name: Install runtime
  community.general.pacman:
    name:
      - podman
      - crun
      - lego
      - bluez
      - bluez-utils
      - hostapd
      - nftables

- name: Create automation group
  ansible.builtin.group:
    name: automation
    gid: "{{ automation_uid }}"

- name: Create automation user
  ansible.builtin.user:
    name: automation
    uid: "{{ automation_uid }}"
    group: automation
    home: /srv/automation/home
    create_home: false
    shell: /usr/bin/nologin
    groups: ''
    password_lock: true

- name: Allocate subordinate IDs
  ansible.builtin.lineinfile:
    path: "/etc/{{ item }}"
    regexp: '^automation:'
    line: automation:200000:65536
    create: true
  loop:
    - subuid
    - subgid

- name: Create automation home
  ansible.builtin.file:
    path: /srv/automation/home
    state: directory
    owner: automation
    group: automation
    mode: '0700'

- name: Create radio directories
  ansible.builtin.file:
    path: "/srv/automation/radio/{{ item }}"
    state: directory
    mode: '0700'
  loop:
    - ''
    - data
    - containers
    - tmp

- name: Create config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/containers/systemd
    - /etc/systemd/system/user@{{ automation_uid }}.service.d
    - /etc/systemd/system/hostapd.service.d

- name: Install user manager config
  ansible.builtin.copy:
    src: user-manager.conf
    dest: /etc/systemd/system/user@{{ automation_uid }}.service.d/clank.conf
  notify: Restart host services

- name: Enable Thread forwarding
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: '1'
    sysctl_file: /etc/sysctl.d/90-clank-thread.conf
    sysctl_set: true
    reload: false

- name: Free Bluetooth UART from serial console
  ansible.builtin.replace:
    path: /boot/cmdline.txt
    regexp: '(^| )console=(serial0|ttyAMA0),\S+ ?'
    replace: '\1'
  notify: Reboot host

- name: Allow Bluetooth stalls during Matter commissioning
  community.general.ini_file:
    path: /etc/bluetooth/main.conf
    section: LE
    option: ConnectionSupervisionTimeout
    value: '600' # 6 seconds, in 10 ms units.
  notify: Restart host services

- name: Mount Bluetooth state in RAM
  ansible.posix.mount:
    path: /var/lib/bluetooth
    src: tmpfs
    fstype: tmpfs
    opts: nodev,nosuid,mode=0700
    state: mounted

- name: Enable Bluetooth
  ansible.builtin.systemd_service:
    name: bluetooth.service
    enabled: true

- name: Install radio startup
  ansible.builtin.copy:
    src: srv/automation/radio/start
    dest: /srv/automation/radio/start
    mode: '0755'
  notify: Restart host services

- name: Install radio container
  ansible.builtin.template:
    src: etc/containers/systemd/clank-multipan.container.j2
    dest: /etc/containers/systemd/clank-multipan.container
  notify: Restart host services

- name: Install network isolation
  ansible.builtin.template:
    src: etc/clank.nft.j2
    dest: /etc/clank.nft
    validate: /usr/bin/nft --check --file %s
  notify: Restart host services

- name: Install host services
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/{{ item }}"
  loop:
    - etc/tmpfiles.d/clank-linger.conf
    - etc/systemd/system/clank-network.service
    - etc/systemd/system/hostapd.service.d/clank.conf
    - etc/systemd/network/wlan0.network
  register: clank_host_services
  notify: Restart host services

- name: Configure access point
  ansible.builtin.template:
    src: etc/hostapd/clank.conf.j2
    dest: /etc/hostapd/clank.conf
    mode: '0600'
  no_log: true
  diff: false
  tags: secrets
  notify: Restart host services

- name: Keep PiKVM discovery off untrusted Wi-Fi
  community.general.ini_file:
    path: /etc/avahi/avahi-daemon.conf
    section: server
    option: deny-interfaces
    value: wlan0
    no_extra_spaces: true
  notify: Restart host services

- name: Disable Wi-Fi client mode
  ansible.builtin.systemd_service:
    name: wpa_supplicant@wlan0.service
    enabled: false
    state: stopped

- name: Reload host services
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: clank_host_services is changed

- name: Enable isolated Wi-Fi services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - clank-network.service
    - hostapd.service
