- name: Check storage UUID
  ansible.builtin.command: findmnt -n -o UUID --mountpoint /srv/automation
  register: clank_apps_storage
  changed_when: false
  failed_when: clank_apps_storage.stdout != automation_storage_uuid
  check_mode: false
  tags: always

- name: Create directories
  ansible.builtin.file:
    path: "/srv/automation/home/{{ item }}"
    state: directory
    mode: '0700'
  loop:
    - .config/containers/systemd
    - .config/systemd/user
    - .config/nginx
    - .local/share/home-assistant
    - .local/share/matter
    - .local/share/linky
    - .local/share/custom_components/ingress
    - .local/share/custom_components/adaptive_lighting
    - .cache/tmp

- name: Configure ESPHome
  tags:
    - esphome
    - esphome-flash
  block:
    - name: Create ESPHome directory
      ansible.builtin.file:
        path: /srv/automation/esphome
        state: directory
        owner: automation
        group: automation
        mode: '0700'
      become_user: root

    - name: Install ESPHome configuration
      ansible.builtin.copy:
        src: srv/automation/esphome/living-room-presence.yaml
        dest: /srv/automation/esphome/living-room-presence.yaml

    - name: Install ESPHome secrets
      ansible.builtin.template:
        src: srv/automation/esphome/secrets.yaml.j2
        dest: /srv/automation/esphome/secrets.yaml
      no_log: true
      diff: false

- name: Build and flash radar firmware
  when: "'esphome-flash' in ansible_run_tags"
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --volume
      - /srv/automation/esphome:/config
      - "{{ automation_images.esphome }}"
      - run
      - /config/living-room-presence.yaml
      - --device
      - "{{ (automation_wifi_devices | selectattr('name', 'equalto', 'living_room_radar') | first).ip }}"
      - --no-logs
    chdir: /srv/automation/home
  tags:
    - esphome-flash

- name: Install containers
  ansible.builtin.template:
    src: "srv/automation/home/.config/containers/systemd/{{ item }}.container.j2"
    dest: "/srv/automation/home/.config/containers/systemd/{{ item }}.container"
  loop:
    - home-assistant
    - matter
    - gateway
    - linky
  notify: Restart apps

- name: Install radio relays
  ansible.builtin.copy:
    src: "srv/automation/home/.config/systemd/user/radio@.{{ item }}"
    dest: "/srv/automation/home/.config/systemd/user/radio@.{{ item }}"
  loop:
    - service
    - socket
  notify: Restart apps

- name: Install container networks
  ansible.builtin.copy:
    src: "srv/automation/home/.config/containers/systemd/{{ item }}.network"
    dest: "/srv/automation/home/.config/containers/systemd/{{ item }}.network"
  loop:
    - internal
    - edge
  notify: Restart apps

- name: Install Home Assistant files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "/{{ item.path }}"
    mode: "{{ item.mode | default(omit) }}"
  loop:
    - path: srv/automation/home/.local/share/home-assistant-start
      mode: '0755'
    - path: srv/automation/home/.local/share/bellows-ezsp-reset.patch
    - path: srv/automation/home/.local/share/home-assistant/
  loop_control:
    label: "{{ item.path }}"
  notify: Restart apps

- name: Download custom components
  ansible.builtin.get_url:
    url: "{{ item.value.url }}"
    dest: "/srv/automation/home/.cache/{{ item.key }}.tar.gz"
    checksum: "{{ item.value.checksum }}"
    mode: '0600'
  loop: "{{ automation_custom_components | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Install custom components
  ansible.builtin.unarchive:
    src: "/srv/automation/home/.cache/{{ item.key }}.tar.gz"
    dest: "/srv/automation/home/.local/share/custom_components/{{ item.key }}/"
    remote_src: true
    include:
      - "{{ item.value.root }}/custom_components/{{ item.key }}/"
    extra_opts:
      - --strip-components=3
    mode: 'u=rwX,go='
  loop: "{{ automation_custom_components | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Restart apps

- name: Seed Home Assistant files
  ansible.builtin.copy:
    content: "{{ '{}' if item == 'scripts' else '[]' }}\n"
    dest: "/srv/automation/home/.local/share/home-assistant/{{ item }}.yaml"
    force: false
  loop:
    - automations
    - scenes
    - scripts

- name: Configure apps
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/{{ item }}"
  loop:
    - srv/automation/home/.local/share/home-assistant/configuration.yaml
    - srv/automation/home/.config/nginx/nginx.conf
  notify: Restart apps

- name: Configure Home Assistant certificate
  ansible.builtin.import_role:
    name: acme
  vars:
    acme_scope: user
    acme_directory: /srv/automation/home/.lego
    acme_domain: "{{ automation_domain }}"
    acme_reload_service: gateway.service

- name: Apply service changes
  ansible.builtin.meta: flush_handlers

- name: Enable radio relays
  ansible.builtin.systemd_service:
    name: "radio@{{ item }}.socket"
    enabled: true
    state: started
  loop: "{{ automation_radio_ports }}"

- name: Start containers
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    state: started
  loop:
    - matter
    - home-assistant
    - gateway
    - linky
