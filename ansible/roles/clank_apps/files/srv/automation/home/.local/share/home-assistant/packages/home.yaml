zha:
  custom_quirks_path: /config/quirks

recorder:
  exclude:
    entity_globs:
      - sensor.living_room_radar_gate_*
    entities:
      - binary_sensor.living_room_radar_moving_target
      - binary_sensor.living_room_radar_still_target
      - sensor.living_room_radar_moving_energy
      - sensor.living_room_radar_still_energy
      - sensor.living_room_radar_moving_distance
      - sensor.living_room_radar_still_distance

input_boolean:
  manual_mode:
    name: Manual mode
    icon: mdi:hand-back-right
  away_mode:
    name: Away mode
    icon: mdi:home-export-outline
  night_mode:
    name: Night mode
    icon: mdi:weather-night

adaptive_lighting:
  - <<: &adaptive_lighting
      max_color_temp: 5500
      sleep_color_temp: 2000
    name: Kitchen
    lights:
      - light.light_bulb_kitchen_main
      - light.light_bulb_kitchen_secondary
  - <<: *adaptive_lighting
    name: Living Room
    lights:
      - light.light_bulb_living_room_main
      - light.light_bulb_living_room_secondary

automation:
  - id: manual_mode
    alias: Manual mode
    triggers:
      - trigger: state
        entity_id: input_boolean.manual_mode
        to: ['on', 'off']
      - trigger: homeassistant
        event: start
    actions:
      - action: switch.turn_{{ 'off' if is_state('input_boolean.manual_mode', 'on') else 'on' }}
        target:
          entity_id:
            - switch.adaptive_lighting_kitchen
            - switch.adaptive_lighting_living_room

  - id: night_schedule
    alias: Night schedule
    triggers:
      - trigger: time
        at:
          - '23:00:00'
          - sensor.wake_time
      - trigger: homeassistant
        event: start
    actions:
      - wait_template: "{{ has_value('sensor.wake_time') }}"
      - action: input_boolean.turn_{{ 'on' if now().hour >= 23 or now() < as_datetime(states('sensor.wake_time'), today_at('10:00')) else 'off' }}
        target:
          entity_id: input_boolean.night_mode

  - id: night_mode
    alias: Night mode
    triggers:
      - trigger: state
        entity_id: input_boolean.night_mode
        to: ['on', 'off']
    actions:
      - action: switch.turn_{{ trigger.to_state.state }}
        target:
          entity_id:
            - switch.adaptive_lighting_kitchen_sleep_mode
            - switch.adaptive_lighting_living_room_sleep_mode

  - id: leaving_home
    alias: Leaving home
    triggers:
      - trigger: state
        entity_id: person.lucas
        from: home
        not_to: [unknown, unavailable]
        for:
          minutes: 2
    conditions:
      - "{{ is_state('input_boolean.manual_mode', 'off') }}"
      - "{{ now() - states.binary_sensor.door_sensor_entrance.last_changed < timedelta(minutes=15) }}"
      - condition: state
        entity_id: binary_sensor.door_sensor_entrance
        state: 'off'
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.away_mode
      - action: light.turn_off
        target:
          entity_id:
            - light.lights_kitchen
            - light.lights_living_room
      - if: "{{ is_state('binary_sensor.window_sensor_living_room', 'on') }}"
        then:
          - action: notify.mobile_app_rosetta
            data:
              title: Window open
              message: You left with the living room window open.

  - id: arriving_home
    alias: Arriving home
    triggers:
      - trigger: state
        entity_id: binary_sensor.door_sensor_entrance
        from: 'off'
        to: 'on'
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.away_mode
      - if: "{{ is_state('person.lucas', 'not_home') }}"
        then:
          - action: notify.mobile_app_rosetta
            data:
              title: Front door opened
              message: The front door opened while you are away.
              data:
                priority: high
                ttl: 0

  - id: front_door_lights
    alias: Turn on kitchen and living room lights when the front door opens
    triggers:
      - trigger: state
        entity_id: binary_sensor.door_sensor_entrance
        from: 'off'
        to: 'on'
    actions:
      - action: light.turn_on
        target:
          entity_id:
            - light.lights_kitchen
            - light.lights_living_room

  - id: low_batteries
    alias: Low batteries
    triggers:
      - trigger: time
        at: '10:00:00'
        weekday: sun
    variables:
      low: >-
        {% set ns = namespace(names=[]) %}
        {% for s in states.sensor
             if s.attributes.device_class == 'battery' and s.state | is_number
             and s.state | float < 20 and not s.entity_id.startswith('sensor.rosetta') %}
          {% set ns.names = ns.names + [s.name ~ ' (' ~ s.state | int ~ '%)'] %}
        {% endfor %}
        {{ ns.names | join(', ') }}
    conditions:
      - condition: template
        value_template: '{{ low != "" }}'
    actions:
      - action: notify.mobile_app_rosetta
        data:
          title: Low batteries
          message: '{{ low }}'
