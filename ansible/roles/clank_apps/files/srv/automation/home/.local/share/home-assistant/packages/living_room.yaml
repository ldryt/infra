light:
  - platform: group
    name: Lights Living Room
    unique_id: lights_living_room
    entities:
      - light.light_bulb_living_room_main
      - light.light_bulb_living_room_secondary

template:
  - binary_sensor:
      - name: Living room occupied
        unique_id: living_room_occupied
        device_class: occupancy
        availability: "{{ has_value('binary_sensor.living_room_radar_presence') }}"
        state: >-
          {{ is_state('binary_sensor.living_room_radar_presence', 'on')
             or is_state('binary_sensor.motion_sensor_living_room_occupancy', 'on') }}
        delay_off:
          minutes: 5

automation:
  - id: living_room_lights
    alias: Living room lights
    use_blueprint:
      path: kb/room_lights.yaml
      input:
        room: living_room
        button: event.button_living_room_button_1
        occupancy: binary_sensor.living_room_occupied
        extra: [light.air_quality_monitor_living_room_display]
        auto_on_at_night: false

  - id: wake_up
    alias: Wake up
    triggers:
      - trigger: time
        at:
          entity_id: sensor.rosetta_next_alarm
          offset: '-00:40:00'
    conditions:
      - condition: state
        entity_id: person.lucas
        state: home
      - condition: state
        entity_id: input_boolean.away_mode
        state: 'off'
      - condition: state
        entity_id: sensor.rosetta_next_alarm
        attribute: Package
        state: com.android.deskclock
      - condition: state
        entity_id: light.light_bulb_living_room_secondary
        state: 'off'
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.night_mode
      - wait_template: "{{ is_state('switch.adaptive_lighting_living_room_sleep_mode', 'off') }}"
        timeout: 10
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_living_room
          lights: light.light_bulb_living_room_secondary
      - repeat:
          for_each: "{{ range(-9, 8) | list }}"
          sequence:
            - condition: template
              value_template: "{{ repeat.first or is_state('light.light_bulb_living_room_secondary', 'on') }}"
            - action: light.turn_on
              target:
                entity_id: light.light_bulb_living_room_secondary
              data:
                brightness_pct: "{{ 10 * 10 ** (repeat.item / 7) }}"
                color_temp_kelvin: 6500
                transition: 240
            - delay: 240

  - id: co2_high
    alias: CO2 high
    triggers:
      - trigger: numeric_state
        entity_id: sensor.air_quality_monitor_living_room_carbon_dioxide
        above: 700
        for:
          minutes: 10
        id: high
      - trigger: numeric_state
        entity_id: sensor.air_quality_monitor_living_room_carbon_dioxide
        below: 600
        id: ok
    actions:
      - if:
          - condition: trigger
            id: high
        then:
          - if: "{{ is_state('input_boolean.away_mode', 'off') and is_state('input_boolean.night_mode', 'off') }}"
            then:
              - action: light.turn_on
                target:
                  entity_id: light.air_quality_monitor_living_room_display
          - action: notify.mobile_app_rosetta
            data:
              title: CO₂ high
              message: >-
                Living room at {{ states('sensor.air_quality_monitor_living_room_carbon_dioxide') }} ppm,
                open the window.
              data:
                tag: co2
        else:
          - action: notify.mobile_app_rosetta
            data:
              message: clear_notification
              data:
                tag: co2
