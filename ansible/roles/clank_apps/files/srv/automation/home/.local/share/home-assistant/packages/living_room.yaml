timer:
  living_room_return:
    duration: '00:30:00'

light:
  - platform: group
    name: Lights Living Room
    unique_id: lights_living_room
    entities:
      - light.light_bulb_living_room_main
      - light.light_bulb_living_room_secondary

template:
  - sensor:
      - name: Wake time
        unique_id: wake_time
        device_class: timestamp
        state: >-
          {% set alarm = as_datetime(states('sensor.rosetta_next_alarm'), none) %}
          {{ (as_local(alarm) if alarm is not none
              and state_attr('sensor.rosetta_next_alarm', 'Package') == 'com.android.deskclock'
              and as_local(alarm).date() == now().date()
              else today_at('10:00')).isoformat() }}
  - binary_sensor:
      - name: Living room occupied
        unique_id: living_room_occupied
        device_class: occupancy
        availability: >-
          {{ has_value('binary_sensor.living_room_radar_presence')
             or has_value('binary_sensor.motion_sensor_living_room_occupancy') }}
        state: >-
          {{ is_state('binary_sensor.living_room_radar_presence', 'on')
             or is_state('binary_sensor.motion_sensor_living_room_occupancy', 'on') }}
        delay_off:
          minutes: 5

automation:
  - id: living_room_lights
    alias: Living room lights
    use_blueprint:
      path: kb/room_lights.yaml
      input:
        room: living_room
        button: event.button_living_room_button_1
        occupancy: binary_sensor.living_room_occupied
        extra: [light.air_quality_monitor_living_room_display]
        protect_sleep: true

  - id: wake_up
    alias: Wake up
    triggers:
      - trigger: time
        at:
          entity_id: sensor.wake_time
          offset: '-00:20:00'
    conditions:
      - "{{ is_state('input_boolean.manual_mode', 'off') }}"
      - condition: state
        entity_id: person.lucas
        state: home
      - condition: state
        entity_id: input_boolean.away_mode
        state: 'off'
      - condition: state
        entity_id: light.light_bulb_living_room_secondary
        state: 'off'
    actions:
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.adaptive_lighting_living_room
          lights: light.light_bulb_living_room_secondary
      - repeat:
          for_each: "{{ range(10) | list }}"
          sequence:
            - condition: template
              value_template: >-
                {{ is_state('input_boolean.manual_mode', 'off')
                   and is_state('input_boolean.away_mode', 'off')
                   and (repeat.first or is_state('light.light_bulb_living_room_secondary', 'on')) }}
            - action: light.turn_on
              target:
                entity_id: light.light_bulb_living_room_secondary
              data:
                brightness_pct: "{{ 0.5 * 200 ** ((repeat.item + 1) / 10) }}"
                color_temp_kelvin: 6500
                transition: 120
            - wait_template: >-
                {{ is_state('input_boolean.manual_mode', 'on')
                   or is_state('input_boolean.away_mode', 'on') }}
              timeout: 120

  - id: co2_high
    alias: CO2 high
    triggers:
      - trigger: numeric_state
        entity_id: sensor.air_quality_monitor_living_room_carbon_dioxide
        above: 700
        for:
          minutes: 10
        id: high
      - trigger: numeric_state
        entity_id: sensor.air_quality_monitor_living_room_carbon_dioxide
        below: 600
        id: ok
    actions:
      - if: "{{ is_state('input_boolean.manual_mode', 'off') and trigger.id == 'high' and is_state('input_boolean.away_mode', 'off') and is_state('input_boolean.night_mode', 'off') }}"
        then:
          - action: light.turn_on
            target:
              entity_id: light.air_quality_monitor_living_room_display
      - action: notify.mobile_app_rosetta
        data:
          title: CO₂ high
          message: >-
            {{ 'Living room at ' ~ states('sensor.air_quality_monitor_living_room_carbon_dioxide')
               ~ ' ppm, open the window.' if trigger.id == 'high' else 'clear_notification' }}
          data:
            tag: co2
