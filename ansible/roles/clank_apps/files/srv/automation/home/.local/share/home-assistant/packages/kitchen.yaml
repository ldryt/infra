timer:
  kitchen_return:
    duration: '00:30:00'

light:
  - platform: group
    name: Lights Kitchen
    unique_id: lights_kitchen
    entities:
      - light.light_bulb_kitchen_main
      - light.light_bulb_kitchen_secondary

template:
  - binary_sensor:
      - name: Kitchen occupied
        unique_id: kitchen_occupied
        device_class: occupancy
        availability: "{{ has_value('binary_sensor.motion_sensor_kitchen_occupancy') }}"
        state: "{{ is_state('binary_sensor.motion_sensor_kitchen_occupancy', 'on') }}"
        delay_off:
          minutes: 2

automation:
  - id: kitchen_lights
    alias: Kitchen lights
    use_blueprint:
      path: kb/room_lights.yaml
      input:
        room: kitchen
        button: event.button_living_room_button_2
        occupancy: binary_sensor.kitchen_occupied

  - id: fridge_open_for_too_long
    alias: Fridge open for too long
    triggers:
      - trigger: state
        entity_id: binary_sensor.door_sensor_fridge
        to: 'on'
        for:
          seconds: 20
    actions:
      - action: scene.create
        data:
          scene_id: kitchen_before_fridge_alert
          snapshot_entities:
            - light.light_bulb_kitchen_main
            - light.light_bulb_kitchen_secondary
      - action: light.turn_on
        target:
          entity_id: light.lights_kitchen
        data:
          rgb_color: [165, 29, 45]
          brightness_pct: 100
      - wait_template: "{{ is_state('binary_sensor.door_sensor_fridge', 'off') }}"
      - condition: state
        entity_id: light.lights_kitchen
        state: 'on'
      - if: "{{ is_state('binary_sensor.kitchen_occupied', 'on') and is_state('input_boolean.away_mode', 'off') }}"
        then:
          - action: scene.turn_on
            target:
              entity_id: scene.kitchen_before_fridge_alert
        else:
          - action: light.turn_off
            target:
              entity_id: light.lights_kitchen
