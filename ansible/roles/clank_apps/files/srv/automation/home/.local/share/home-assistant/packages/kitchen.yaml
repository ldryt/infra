light:
  - platform: group
    name: Lights Kitchen
    unique_id: lights_kitchen
    entities:
      - light.light_bulb_kitchen_main
      - light.light_bulb_kitchen_secondary

automation:
  - id: kitchen_button
    alias: Kitchen button
    triggers:
      - trigger: event.received
        target:
          entity_id: event.button_living_room_button_2
        options:
          event_type: [multi_press_1]
        id: toggle
      - trigger: event.received
        target:
          entity_id: event.button_living_room_button_2
        options:
          event_type: [multi_press_2]
        id: white
      - trigger: event.received
        target:
          entity_id: event.button_living_room_button_2
        options:
          event_type: [long_press]
        id: warm
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: toggle
            sequence:
              - action: light.toggle
                target:
                  entity_id: light.lights_kitchen
          - conditions:
              - condition: trigger
                id: white
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.lights_kitchen
                data:
                  color_temp_kelvin: 2785
                  brightness_pct: 100
          - conditions:
              - condition: trigger
                id: warm
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.lights_kitchen
                data:
                  color_temp_kelvin: 2000
                  brightness_pct: 33
                  transition: 2

  - id: kitchen_motion_light
    alias: Kitchen motion light
    triggers:
      - trigger: state
        entity_id: binary_sensor.motion_sensor_kitchen_occupancy
        to: 'on'
        id: occupied
      - trigger: numeric_state
        entity_id: sensor.motion_sensor_kitchen_illuminance
        below: 100
        id: occupied
      - trigger: state
        entity_id: binary_sensor.motion_sensor_kitchen_occupancy
        to: 'off'
        for:
          minutes: 2
        id: empty
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: occupied
              - condition: state
                entity_id: binary_sensor.motion_sensor_kitchen_occupancy
                state: 'on'
              - condition: state
                entity_id: light.lights_kitchen
                state: 'off'
              - condition: numeric_state
                entity_id: sensor.motion_sensor_kitchen_illuminance
                below: 100
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.lights_kitchen
          - conditions:
              - condition: trigger
                id: empty
            sequence:
              - action: light.turn_off
                target:
                  entity_id: light.lights_kitchen

  - id: fridge_open_for_too_long
    alias: Fridge open for too long
    triggers:
      - trigger: state
        entity_id: binary_sensor.door_sensor_fridge
        to: 'on'
        for:
          seconds: 10
    actions:
      - action: scene.create
        data:
          scene_id: kitchen_before_fridge_alert
          snapshot_entities:
            - light.light_bulb_kitchen_main
            - light.light_bulb_kitchen_secondary
      - action: light.turn_on
        target:
          entity_id: light.lights_kitchen
        data:
          rgb_color: [165, 29, 45]
          brightness_pct: 100
      - wait_for_trigger:
          - trigger: state
            entity_id: binary_sensor.door_sensor_fridge
            to: 'off'
      - action: scene.turn_on
        target:
          entity_id: scene.kitchen_before_fridge_alert
