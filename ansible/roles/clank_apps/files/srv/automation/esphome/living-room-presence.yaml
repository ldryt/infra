esphome:
  name: living-room-presence
  friendly_name: Living room radar
  compile_process_limit: 1
  on_boot:
    - delay: 3s
    - button.press: radar_query

esp32:
  variant: esp32c3

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: Clank
  password: !secret wifi_password

uart:
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 256000

ld2410:

binary_sensor:
  - platform: ld2410
    has_target:
      name: Presence
    has_moving_target:
      name: Moving target
    has_still_target:
      name: Still target

sensor:
  - platform: wifi_signal
    name: Wi-Fi signal
  - platform: ld2410
    moving_distance:
      name: Moving distance
    still_distance:
      name: Still distance
    moving_energy:
      name: Moving energy
    still_energy:
      name: Still energy

    g0:
      still_energy:
        name: Gate 0 still energy
    g1:
      still_energy:
        name: Gate 1 still energy
    g2:
      still_energy:
        name: Gate 2 still energy
    g3:
      still_energy:
        name: Gate 3 still energy
    g4:
      still_energy:
        name: Gate 4 still energy
    g5:
      still_energy:
        name: Gate 5 still energy
    g6:
      still_energy:
        name: Gate 6 still energy
    g7:
      still_energy:
        name: Gate 7 still energy
    g8:
      still_energy:
        name: Gate 8 still energy

switch:
  - platform: ld2410
    engineering_mode:
      name: Engineering mode
    bluetooth:
      name: Radar Bluetooth

number:
  - platform: ld2410
    timeout:
      name: Presence timeout
    max_move_distance_gate:
      name: Maximum moving gate
    max_still_distance_gate:
      name: Maximum still gate

    g0:
      move_threshold:
        id: g0_move_threshold
      still_threshold:
        name: Gate 0 still threshold
    g1:
      move_threshold:
        id: g1_move_threshold
      still_threshold:
        name: Gate 1 still threshold
    g2:
      move_threshold:
        id: g2_move_threshold
      still_threshold:
        name: Gate 2 still threshold
    g3:
      move_threshold:
        id: g3_move_threshold
      still_threshold:
        name: Gate 3 still threshold
    g4:
      move_threshold:
        id: g4_move_threshold
      still_threshold:
        name: Gate 4 still threshold
    g5:
      move_threshold:
        id: g5_move_threshold
      still_threshold:
        name: Gate 5 still threshold
    g6:
      move_threshold:
        id: g6_move_threshold
      still_threshold:
        name: Gate 6 still threshold
    g7:
      move_threshold:
        id: g7_move_threshold
      still_threshold:
        name: Gate 7 still threshold
    g8:
      move_threshold:
        id: g8_move_threshold
      still_threshold:
        name: Gate 8 still threshold

text_sensor:
  - platform: ld2410
    version:
      name: Radar firmware

button:
  - platform: ld2410
    query_params:
      id: radar_query
      name: Refresh settings
  - platform: restart
    name: Restart ESP32
