blueprint:
  name: Room lights
  description: Button controls, automatic lighting after dark, and vacancy shutoff.
  domain: automation
  input:
    lights:
    night_light:
    button:
    occupancy:
    protect_sleep:
      default: false

variables:
  lights: !input lights
  night_light: !input night_light
  protect_sleep: !input protect_sleep
  turn_on_target: >-
    {{ night_light if is_state('input_boolean.night_mode', 'on')
       and is_state('input_boolean.manual_mode', 'off') else lights }}

triggers:
  - trigger: event.received
    target:
      entity_id: !input button
    options:
      event_type: [multi_press_1, multi_press_2, long_press]
    id: button
  - trigger: state
    entity_id: !input occupancy
    from: 'off'
    to: 'on'
    id: occupied
  # Also catches lights switched on in an empty room by the door or dashboard.
  - trigger: time_pattern
    minutes: '/2'
    id: vacancy

conditions:
  - >-
    {{ trigger.id == 'button' or
       (is_state('input_boolean.manual_mode', 'off')
        and (not protect_sleep or is_state('input_boolean.night_mode', 'off'))) }}
  - condition: or
    conditions:
      - condition: trigger
        id: [button, occupied]
      - condition: and
        conditions:
          - condition: state
            entity_id: !input occupancy
            state: 'off'
          - condition: state
            entity_id: !input lights
            state: 'on'
            for: '00:05:00'

actions:
  - choose:
      - conditions: "{{ trigger.id == 'button' and trigger.to_state.attributes.event_type == 'multi_press_1' }}"
        sequence:
          - if: "{{ is_state(lights, 'on') }}"
            then:
              - action: light.turn_off
                target:
                  entity_id: !input lights
            else:
              - action: light.turn_on
                target:
                  entity_id: "{{ turn_on_target }}"
      - conditions:
          - condition: trigger
            id: button
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input lights
            data: >-
              {{ {'color_temp_kelvin': 2785, 'brightness_pct': 100}
                 if trigger.to_state.attributes.event_type == 'multi_press_2'
                 else {'color_temp_kelvin': 2000, 'brightness_pct': 33, 'transition': 2} }}
      - conditions:
          - condition: trigger
            id: occupied
          - condition: state
            entity_id: input_boolean.away_mode
            state: 'off'
          - condition: state
            entity_id: sun.sun
            state: below_horizon
          - condition: state
            entity_id: !input lights
            state: 'off'
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ turn_on_target }}"
      - conditions:
          - condition: trigger
            id: vacancy
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input lights
