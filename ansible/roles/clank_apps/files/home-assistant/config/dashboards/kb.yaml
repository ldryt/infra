views:
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Lighting
            icon: mdi:lightbulb-group
          - type: tile
            entity: light.lights_kitchen
            name: Kitchen
            features: &brightness
              - type: light-brightness
            grid_options: &full
              columns: full
          - type: tile
            entity: light.lights_living_room
            name: Living room
            features: *brightness
            grid_options: *full
          - type: tile
            entity: input_boolean.manual_mode
            name: Manual lighting
            icon_tap_action:
              action: toggle
          - type: tile
            entity: input_boolean.night_mode
            name: Night mode
            icon_tap_action:
              action: toggle

      - type: grid
        cards:
          - type: heading
            heading: Home status
            icon: mdi:home-outline
          - type: tile
            entity: binary_sensor.door_sensor_entrance
            name: Front door
          - type: tile
            entity: binary_sensor.window_sensor_living_room
            name: Living room window
          - type: tile
            entity: binary_sensor.door_sensor_fridge
            name: Fridge
          - type: tile
            entity: input_boolean.away_mode
            name: Away mode
            icon_tap_action:
              action: more-info
          - type: tile
            entity: sensor.air_quality_monitor_living_room_temperature
            name: Living room temperature
          - type: tile
            entity: sensor.air_quality_monitor_living_room_carbon_dioxide
            name: Living room CO₂

  - title: Rooms
    path: rooms
    icon: mdi:floor-plan
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Living room
            icon: mdi:sofa
          - type: tile
            entity: light.light_bulb_living_room_main
            name: Main light
          - type: tile
            entity: light.light_bulb_living_room_secondary
            name: Secondary light
          - type: tile
            entity: light.air_quality_monitor_living_room_display
            name: Air monitor display
          - type: tile
            entity: binary_sensor.living_room_occupied
            name: Occupancy
          - type: tile
            entity: sensor.air_quality_monitor_living_room_humidity
            name: Humidity
          - type: tile
            entity: sensor.air_quality_monitor_living_room_pm2_5
            name: PM2.5
          - type: history-graph
            title: Air quality
            hours_to_show: 24
            entities:
              - sensor.air_quality_monitor_living_room_carbon_dioxide
            grid_options: *full

      - type: grid
        cards:
          - type: heading
            heading: Kitchen
            icon: mdi:fridge-outline
          - type: tile
            entity: light.light_bulb_kitchen_main
            name: Main light
          - type: tile
            entity: light.light_bulb_kitchen_secondary
            name: Secondary light
          - type: tile
            entity: binary_sensor.kitchen_occupied
            name: Occupancy
          - type: heading
            heading: Entrance
            icon: mdi:door
          - type: tile
            entity: sensor.temperature_sensor_entrance_temperature
            name: Temperature
          - type: tile
            entity: sensor.temperature_sensor_entrance_humidity
            name: Humidity

  - title: Energy
    path: energy
    icon: mdi:lightning-bolt
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Home (Linky)
            icon: mdi:transmission-tower
          - type: energy-date-selection
            grid_options: *full
          - type: statistics-graph
            title: Home consumption
            chart_type: line
            stat_types:
              - change
            unit: kWh
            energy_date_selection: true
            min_y_axis: 0
            entities:
              - entity: !secret linky_consumption_statistic
                name: Home (Linky)
              - entity: sensor.plug_living_room_summation_delivered
                name: Home server
            grid_options: *full
          - type: energy-sources-table
            grid_options: *full
