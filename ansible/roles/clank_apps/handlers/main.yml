- name: Reload user units
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: Restart apps

- name: Restart radio relays
  ansible.builtin.systemd_service:
    name: "radio@{{ item }}.socket"
    state: restarted
  loop: "{{ automation_radio_ports }}"
  listen: Restart apps

- name: Restart apps
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    state: restarted
  loop:
    - matter
    - home-assistant
    - gateway
