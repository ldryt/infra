- name: Install restic
  community.general.pacman:
    name:
      - restic
      - rclone

- name: Create restic directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
  loop:
    - /etc/restic
    - "{{ restic_cache_directory }}"

- name: Install restic secrets
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    mode: '0600'
  loop:
    - { dest: /etc/restic/password, content: "{{ restic_password }}" }
    - { dest: /etc/restic/ssh-key, content: "{{ restic_ssh_key }}\n" }
    # rclone rewrites this file when it refreshes the OneDrive token.
    - { dest: "{{ restic_rclone_config }}", content: "{{ restic_rclone_conf }}" }
  loop_control:
    label: "{{ item.dest }}"
  no_log: true
  diff: false
  tags: secrets

- name: Install backup services
  ansible.builtin.template:
    src: restic-backups.service.j2
    dest: "/etc/systemd/system/restic-backups-{{ item.key }}.service"
  loop: "{{ restic_hosts | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: restic_services

- name: Install backup timers
  ansible.builtin.copy:
    src: restic-backups.timer
    dest: "/etc/systemd/system/restic-backups-{{ item }}.timer"
  loop: "{{ restic_hosts.keys() }}"
  register: restic_timers

- name: Reload backup units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: restic_services is changed or restic_timers is changed

- name: Enable backup timers
  ansible.builtin.systemd_service:
    name: "restic-backups-{{ item }}.timer"
    enabled: true
    state: started
  loop: "{{ restic_hosts.keys() }}"
