- name: Create certificate storage
  ansible.builtin.file:
    path: "{{ acme_directory }}"
    state: directory
    mode: '0700'
  when: acme_scope == 'user'

- name: Create PiKVM certificate storage
  ansible.builtin.command: /usr/bin/kvmd-pstrun -- install -d -m 0700 {{ acme_directory }}
  args:
    creates: "{{ acme_directory }}"
  when: acme_scope == 'system'

- name: Install DNS token
  ansible.builtin.copy:
    content: "{{ acme_token }}"
    dest: "{{ acme_token_file }}"
    mode: '0600'
  no_log: true
  diff: false
  tags: secrets

- name: Install certificate service
  ansible.builtin.template:
    src: acme.service.j2
    dest: "{{ acme_unit_directory }}/{{ acme_name }}.service"
    mode: "{{ '0644' if acme_scope == 'system' else '0600' }}"

- name: Install certificate timer
  ansible.builtin.copy:
    src: acme.timer
    dest: "{{ acme_unit_directory }}/{{ acme_name }}.timer"
    mode: "{{ '0644' if acme_scope == 'system' else '0600' }}"
  notify: Restart ACME timer

- name: Reload certificate manager
  ansible.builtin.systemd_service:
    scope: "{{ acme_scope }}"
    daemon_reload: true

- name: Issue first certificate
  ansible.builtin.command: "systemctl {{ '--user' if acme_scope == 'user' else '' }} start {{ acme_name }}.service"
  args:
    creates: "{{ acme_directory }}/certificates/{{ acme_domain }}.crt"

- name: Enable certificate renewal
  ansible.builtin.systemd_service:
    name: "{{ acme_name }}.timer"
    scope: "{{ acme_scope }}"
    enabled: true
    state: started
